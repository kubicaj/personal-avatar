name: Deploy Gradio App

# always run when some change happen in main repo
on:
  push:
    branches:
      - main

jobs:
  deploy:
    # =========================================================
    # Main job to deploy application to Hugging Face
    # =========================================================
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Hugging Face client
        run: python -m pip install --upgrade huggingface_hub

      - name: Deploy to Hugging Face Spaces
        if: github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id="kubicajuraj/avatar_kubica",
              repo_type="space",
              folder_path=".",
              allow_patterns=[
                  ".gitattributes",
                  ".gitignore",
                  "README.md",
                  "requirements.txt",
                  "app.py",
                  "guardrails.py",
                  "personal_avatar_llm.py",
                  "resources/**",
                  "services/*.py",
                  "ui/*.py",
                  "ui/*.css",
              ],
              commit_message="Deploy from GitHub Actions",
          )
          PY
